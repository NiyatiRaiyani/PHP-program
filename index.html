<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Charusat University UK Trip</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container">

        <h1>Welcome to Charusat University UK Trip</h1>

        <p>
            Enter your details and submit this form to confirm
            your participation in the trip.
        </p>

        <form action="index.php" method="post">

            <input
                type="text"
                name="name"
                id="name"
                placeholder="Enter your name"
                required
            >

            <input
                type="number"
                name="age"
                id="age"
                placeholder="Enter your age"
                required
            >

            <input
                type="text"
                name="gender"
                id="gender"
                placeholder="Enter your gender"
                required
            >

            <input
                type="email"
                name="email"
                id="email"
                placeholder="Enter your email"
                required
            >

            <input
                type="tel"
                name="phone"
                id="phone"
                placeholder="Enter your phone number"
                required
            >

            <textarea
                name="desc"
                id="desc"
                rows="5"
                placeholder="Enter any other information here">
            </textarea>

            <div class="button-group">

                <button type="submit" class="btn submit-btn">
                    Submit
                </button>

                <button type="reset" class="btn reset-btn">
                    Reset
                </button>

            </div>

        </form>

    </div>

    <script src="index.js"></script>

</body>

</html>
